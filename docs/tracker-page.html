<title>Oluwatobi's Job Hunt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --ground:#F2F5F2; --surface:#FFFFFF; --sunk:#E8EEEA; --ink:#15201B; --muted:#5A6A62; --line:#D5DED8;
  --accent:#0B6E4F; --accent-ink:#FFFFFF; --accent-soft:#DCEFE6;
  --warn:#9A5B00; --warn-soft:#FBEBD0; --bad:#B42318; --bad-soft:#FBE3E0; --info:#1D5FA8; --info-soft:#E0ECF9;
  --fit-hi:#0B6E4F; --fit-mid:#7A8F2A; --fit-lo:#9AA59F;
  --display:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif;
  --body:"Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E4ECE7; --muted:#95A69D; --line:#2A3830;
    --accent:#3DBE8C; --accent-ink:#06120C; --accent-soft:#16392B;
    --warn:#E9A94B; --warn-soft:#3A2A10; --bad:#F2877B; --bad-soft:#3B1814; --info:#7FB2EE; --info-soft:#15263B;
    --fit-hi:#3DBE8C; --fit-mid:#B4C455; --fit-lo:#5F6E66;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1411; --surface:#161F1A; --sunk:#1D2822; --ink:#E4ECE7; --muted:#95A69D; --line:#2A3830;
  --accent:#3DBE8C; --accent-ink:#06120C; --accent-soft:#16392B;
  --warn:#E9A94B; --warn-soft:#3A2A10; --bad:#F2877B; --bad-soft:#3B1814; --info:#7FB2EE; --info-soft:#15263B;
  --fit-hi:#3DBE8C; --fit-mid:#B4C455; --fit-lo:#5F6E66;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:24px 64px;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font:700 clamp(26px,4vw,36px)/1.1 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.run{font:500 12px/1.4 var(--mono);color:var(--muted);text-align:right}
.run b{color:var(--ink);font-weight:600}
.pipe{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.stage{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer;color:inherit;font:inherit;display:grid;gap:2px}
.stage:hover{border-color:var(--accent)}
.stage[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.stage .n{font:600 22px/1 var(--mono);font-variant-numeric:tabular-nums}
.stage .l{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.stage.hot .n{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:10px;flex-wrap:wrap}
.tab{border:0;background:none;color:var(--muted);font:600 13px/1 var(--body);padding:9px 12px;border-radius:7px;cursor:pointer}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.tab .c{font:500 11px var(--mono);color:var(--muted);margin-left:4px}
.grow{flex:1 1 180px}
input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
input[type=search]{width:100%}
select{padding-right:6px}
label.fit{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
label.fit output{font:600 13px var(--mono);color:var(--ink);min-width:2ch}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.list{display:grid;gap:10px}
.job{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;grid-template-columns:64px minmax(0,1fr) 200px;gap:14px;align-items:start}
.score{display:grid;gap:6px;justify-items:center;padding-top:2px}
.score .v{font:600 24px/1 var(--mono);font-variant-numeric:tabular-nums}
.meter{width:44px;height:5px;border-radius:3px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%}
.main{display:grid;gap:6px;min-width:0}
.title{font:600 16px/1.3 var(--body);margin:0;text-wrap:balance}
.title a{color:inherit;text-decoration:none}
.title a:hover{text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.co{color:var(--ink);font-weight:600}
.pill{font:600 11px/1 var(--body);letter-spacing:.03em;padding:5px 8px;border-radius:999px;white-space:nowrap}
.p-remote_open,.p-nigeria,.p-africa{background:var(--accent-soft);color:var(--accent)}
.p-sponsor_yes{background:var(--info-soft);color:var(--info)}
.p-sponsor_likely{background:var(--info-soft);color:var(--info)}
.p-sponsor_unknown{background:var(--sunk);color:var(--muted)}
.p-restricted{background:var(--bad-soft);color:var(--bad)}
.p-stretch{background:var(--warn-soft);color:var(--warn)}
.why{margin:0;font-size:14px}
.ev{margin:0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.ev.bad{color:var(--bad)}
.gaps{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:var(--muted)}
.gap{border:1px dashed var(--line);border-radius:6px;padding:2px 6px;color:var(--ink)}
.side{display:grid;gap:8px}
.side select{width:100%}
.s-applied,.s-interview,.s-offer{border-color:var(--accent);color:var(--accent);font-weight:600}
.s-rejected{color:var(--bad)}
.s-skipped{color:var(--muted)}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;font:600 13px var(--body);border-radius:8px;padding:8px 10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.note{grid-column:2 / 4}
.note textarea{width:100%;min-height:56px;resize:vertical;font-size:14px}
.note .hint{font-size:12px;color:var(--muted)}
.letter{grid-column:1 / -1;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.letter pre{white-space:pre-wrap;font:14px/1.55 var(--body);margin:0;background:var(--sunk);padding:14px;border-radius:8px;max-height:420px;overflow:auto}
.pack{grid-template-columns:minmax(0,1fr);align-items:stretch;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:14px}
.pack-head{display:grid;grid-template-columns:64px minmax(0,1fr) 220px;gap:14px;align-items:start}
.pack-sec{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.pack-sec h3{margin:0;font:600 12px/1 var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pack-sec h3 .step{font:600 11px var(--mono);background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:3px 8px}
.pack-sec h3 .tools{margin-left:auto;display:flex;gap:6px;text-transform:none;letter-spacing:0}
.posting{white-space:pre-wrap;font:14px/1.55 var(--body);background:var(--sunk);padding:14px;border-radius:8px;max-height:380px;overflow:auto;margin:0}
.cvdoc{background:#FFFFFF;color:#1d1d1d;border:1px solid var(--line);border-radius:8px;padding:22px 26px;max-height:560px;overflow:auto;font:13px/1.45 Arial, "Liberation Sans", sans-serif}
.cvdoc h3.cv-name{font:700 22px/1.2 Arial, sans-serif;color:#1F3864;margin:0}
.cvdoc .cv-head{margin:2px 0;color:#404040;font-size:14px}
.cvdoc .cv-contact{margin:0 0 6px;font-size:12px}
.cvdoc a{color:#1F4E79}
.cvdoc h4{font:700 12.5px Arial, sans-serif;text-transform:uppercase;color:#1F3864;border-bottom:1px solid #999;margin:12px 0 5px;padding-bottom:2px}
.cvdoc p{margin:0 0 3px}
.cvdoc ul{margin:2px 0 6px;padding-left:20px}
.cvdoc li{margin:0 0 2px}
.cvdoc .cv-item{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.cvdoc .cv-tech{font-style:italic;color:#404040;font-size:12px}
.letter-text{white-space:pre-wrap;overflow-wrap:anywhere;font:15px/1.6 var(--body);background:var(--sunk);padding:16px;border-radius:8px;margin:0}
.why-text{font-size:14px;color:var(--muted);margin:0}
@media (max-width:760px){.pack-head{grid-template-columns:52px minmax(0,1fr)}.pack-head .side{grid-column:1 / -1}.cvdoc{padding:14px}}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}
.more{justify-self:center}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:8px 14px;border-radius:8px;font-size:13px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
@media (max-width:760px){
  .pipe{grid-template-columns:repeat(4,minmax(0,1fr))}
  .job{grid-template-columns:52px minmax(0,1fr)}
  .side{grid-column:1 / -1}
  .note{grid-column:1 / -1}
  .run{text-align:left}
}
@media (prefers-reduced-motion:no-preference){.stage,.btn,.tab{transition:border-color .15s, background .15s}}
/* Pack cards are one column at every width; they must not take the
   2-column grid of the compact .job card. */
.job.pack{grid-template-columns:minmax(0,1fr)}
.btn{white-space:nowrap}
.pack-sec h3 .tools{flex-wrap:wrap;justify-content:flex-end}
@media (max-width:760px){
  .job.pack{padding:14px;gap:12px}
  .pack-head{grid-template-columns:48px minmax(0,1fr);gap:10px}
  .pack-head .side{grid-column:1 / -1;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:stretch}
  .pack-head .side select,.pack-head .side .btn{min-height:44px}
  .pack-sec h3{row-gap:10px}
  .pack-sec h3 .tools{margin-left:0;width:100%;justify-content:flex-start}
  .pack-sec h3 .tools .btn{flex:1 1 calc(50% - 6px);min-height:44px}
  .posting{max-height:60vh;font-size:14px;padding:12px}
  .letter-text{font-size:14px;padding:12px}
  .pack-head .side .btn{white-space:normal;text-align:center;line-height:1.25}
  .cvdoc{max-height:70vh;padding:12px;font-size:12.5px}
  .note textarea{font-size:16px}
  .stage{padding:9px 8px;min-width:0}
  .stage .l{font-size:10px;letter-spacing:.02em;overflow-wrap:anywhere}
}
</style>

<div class="wrap">
  <header>
    <div>
      <h1>Oluwatobi's Job Hunt</h1>
      <p class="sub">ML and AI roles from company boards and job sites, scored against your CV. You apply yourself.</p>
    </div>
    <div class="run" id="run">Connecting…</div>
  </header>

  <nav class="pipe" id="pipe" aria-label="Applications by status"></nav>

  <div class="bar">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="grow"><input type="search" id="q" placeholder="Search company, title, country" aria-label="Search"></div>
    <select id="label" aria-label="Location label">
      <option value="">Any location</option>
      <option value="remote_open">Remote, open to Nigeria</option>
      <option value="nigeria">In Nigeria</option>
      <option value="africa">Elsewhere in Africa</option>
      <option value="sponsor_yes">Abroad, sponsors</option>
      <option value="sponsor_likely">Abroad, known sponsor</option>
    </select>
    <select id="level" aria-label="Level">
      <option value="">Any level</option>
      <option value="junior">Intern to junior</option>
      <option value="mid">Mid (stretch)</option>
      <option value="unspecified">Not stated</option>
      <option value="senior">Senior and above</option>
    </select>
    <label class="fit" for="minfit">Fit ≥ <output id="minfitv">0</output><input type="range" id="minfit" min="0" max="80" step="5" value="0"></label>
  </div>

  <div class="legend" id="legend"></div>
  <section class="list" id="list" aria-live="polite"></section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const STATUSES = ["new","drafted","applied","interview","offer","rejected","skipped"];
const STATUS_TEXT = {new:"New",drafted:"Drafted",applied:"Applied",interview:"Interview",offer:"Offer",rejected:"Rejected",skipped:"Skipped"};
const LABEL_TEXT = {remote_open:"Remote, open to you",nigeria:"Nigeria",africa:"Africa",sponsor_yes:"Sponsors visa",sponsor_likely:"Known sponsor",sponsor_unknown:"Sponsorship not stated",restricted:"Restricted"};
const LABEL_RANK = {remote_open:0,nigeria:1,africa:2,sponsor_yes:3,sponsor_likely:4,sponsor_unknown:5,restricted:6};
const JUNIOR = new Set(["intern","graduate","junior","entry"]);
const SENIOR = new Set(["senior","lead","staff","principal","manager"]);
const TABS = [
  {id:"ready", text:"Ready to apply"},
  {id:"review", text:"To review"},
  {id:"mine", text:"My applications"},
  {id:"all", text:"All"},
];

const state = {meta:null, chunks:{}, edits:{}, letters:{}, packs:{}, open:new Set(), tab:"review", status:"", q:"", label:"", level:"", minfit:0, limit:60, db:null, writable:true};
state.tab = "ready";

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0,10);
const stamp = () => new Date().toISOString().slice(0,19) + "Z";

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2200); }

// Jobs from the latest run, with your page edits laid on top.
function jobs(){
  const run = state.meta && state.meta.run;
  const byKey = new Map();
  for (const [id, c] of Object.entries(state.chunks)) {
    if (run && c.run !== run) continue;
    if (state.meta && !state.meta.chunks.includes(id)) continue;
    for (const j of c.jobs || []) byKey.set(j.k, {...j});
  }
  for (const [k, e] of Object.entries(state.edits)) {
    let j = byKey.get(k);
    if (!j) {
      if (!e.snap) continue;
      j = {k, ...e.snap, status:"new", notes:"", da:"", su:"", gaps:[], proj:[], gone:true};
      byKey.set(k, j);
    }
    if (!j.su || (e.updated_at || "") >= j.su) {
      if (e.status) j.status = e.status;
      if ("notes" in e) j.notes = e.notes || "";
      if ("date_applied" in e) j.da = e.date_applied || "";
    }
  }
  return [...byKey.values()];
}

function levelGroup(l){ return JUNIOR.has(l) ? "junior" : SENIOR.has(l) ? "senior" : l; }

function inTab(j, tab){
  if (tab === "review") return j.status === "new" && j.lab !== "restricted";
  if (tab === "ready") return j.status === "drafted";
  if (tab === "mine") return !["new","skipped","drafted"].includes(j.status);
  if (tab === "restricted") return j.lab === "restricted";
  return true;
}

function filtered(all){
  const q = state.q.trim().toLowerCase();
  return all.filter(j =>
    inTab(j, state.tab) &&
    (!state.status || j.status === state.status) &&
    (!state.label || j.lab === state.label) &&
    (!state.level || levelGroup(j.lvl) === state.level) &&
    (j.fit || 0) >= state.minfit &&
    (!q || `${j.co} ${j.t} ${j.ctry} ${j.loc}`.toLowerCase().includes(q))
  ).sort((a,b) => Math.round(b.fit||0) - Math.round(a.fit||0) || (LABEL_RANK[a.lab]??9) - (LABEL_RANK[b.lab]??9) || (b.fit||0)-(a.fit||0));
}

function renderHeader(all){
  const m = state.meta;
  if (!m) { $("#run").innerHTML = state.db ? "Waiting for the first run" : "Read only: open this page on claude.ai to load your jobs"; return; }
  const when = new Date(m.run);
  const c = m.counts || {};
  $("#run").innerHTML = `Last run <b>${esc(when.toLocaleString([], {dateStyle:"medium", timeStyle:"short"}))}</b><br>${c.total ?? "?"} jobs found in total, ${c.new_today ?? 0} new that day<br>${m.shown} shown here`;
}

function renderPipe(all){
  const counts = Object.fromEntries(STATUSES.map(s => [s, 0]));
  for (const j of all) if (j.lab !== "restricted" || j.status !== "new") counts[j.status] = (counts[j.status]||0) + 1;
  $("#pipe").innerHTML = STATUSES.map(s => `<button class="stage ${["applied","interview","offer"].includes(s) && counts[s] ? "hot" : ""}" data-status="${s}" aria-pressed="${state.status===s}"><span class="n">${counts[s]}</span><span class="l">${STATUS_TEXT[s]}</span></button>`).join("");
}

function renderTabs(all){
  $("#tabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${state.tab===t.id}">${t.text}<span class="c">${all.filter(j=>inTab(j,t.id)).length}</span></button>`).join("");
}

function fitColor(f){ return f >= 55 ? "var(--fit-hi)" : f >= 40 ? "var(--fit-mid)" : "var(--fit-lo)"; }

function card(j){
  const f = Math.round(j.fit || 0);
  const lvl = j.lvl === "unspecified" ? "Level not stated" : (j.lvl || "").replace(/^./, c => c.toUpperCase());
  const opts = STATUSES.map(s => `<option value="${s}" ${s===j.status?"selected":""}>${STATUS_TEXT[s]}</option>`).join("");
  const hasLetter = !!j.lf;
  const open = state.open.has(j.k);
  const letter = state.letters[j.k];
  return `<article class="job" data-k="${esc(j.k)}">
    <div class="score" title="Fit score out of 100"><span class="v" style="color:${fitColor(f)}">${f}</span><span class="meter"><i style="width:${Math.min(100,f)}%;background:${fitColor(f)}"></i></span></div>
    <div class="main">
      <h2 class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.t)}</a></h2>
      <div class="meta"><span class="co">${esc(j.co)}</span><span>${esc(j.ctry || j.loc || "")}</span>
        <span class="pill p-${esc(j.lab)}">${esc(LABEL_TEXT[j.lab] || j.lab)}</span>
        <span>${esc(lvl)}</span>${j.st ? '<span class="pill p-stretch">Stretch</span>' : ""}
        ${j.df ? `<span>Found ${esc(j.df)}</span>` : ""}${j.da ? `<span>Applied ${esc(j.da)}</span>` : ""}
        ${j.gone ? "<span>Posting no longer listed</span>" : ""}</div>
      ${j.why ? `<p class="why">${esc(j.why)}</p>` : ""}
      ${j.lab === "restricted" && j.rst ? `<p class="ev bad">From the post: “${esc(j.rst)}”</p>` : (j.spe ? `<p class="ev">${esc(j.spe)}</p>` : "")}
      ${j.gaps && j.gaps.length ? `<div class="gaps">Gaps ${j.gaps.map(g=>`<span class="gap">${esc(g)}</span>`).join("")}</div>` : ""}
    </div>
    <div class="side">
      <select class="status s-${j.status}" aria-label="Status for ${esc(j.t)}" ${state.writable?"":"disabled"}>${opts}</select>
      <div class="row2">
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Open post ↗</a>
        ${hasLetter ? `<button class="btn letter-btn" aria-expanded="${open}">${open?"Hide":"Letter"}</button>` : `<button class="btn note-btn">Note</button>`}
      </div>
      ${j.cvn ? `<div class="row2">${(j.cvp || j.cvn) ? `<a class="btn cv-pdf" href="${esc(j.cvp || "#")}" target="_blank" rel="noopener">CV (PDF)</a>` : ""}<button class="btn cv-word">CV (Word)</button></div>` : ""}
    </div>
    ${(j.notes || state.open.has("n:"+j.k)) ? `<div class="note"><textarea aria-label="Notes" placeholder="Recruiter name, dates, next step" ${state.writable?"":"disabled"}>${esc(j.notes)}</textarea><div class="hint">Saved when you click away.</div></div>` : ""}
    ${open ? `<div class="letter">${letter ? `<pre>${esc(splitLetter(letter.text).letter)}</pre>${letter.why ? `<p class="why-text"><b>Why this company</b> (for application forms): ${esc(letter.why)}</p>` : ""}<div class="bar"><button class="btn copy">Copy letter</button>${hasLetter && !j.notes && !state.open.has("n:"+j.k) ? '<button class="btn note-btn">Add note</button>' : ""}</div>` : "<p class='ev'>Loading letter…</p>"}</div>` : ""}
  </article>`;
}

function splitLetter(text){
  const parts = {}; let cur = "intro";
  for (const line of (text || "").split("\n")) {
    const m = line.match(/^##\s+(.*)/);
    if (m) { cur = m[1].trim().toLowerCase(); parts[cur] = ""; continue; }
    parts[cur] = (parts[cur] || "") + line + "\n";
  }
  return {letter: (parts["cover letter"] || parts["intro"] || "").trim(), why: (parts["why this company"] || "").trim()};
}

function packCard(j){
  const f = Math.round(j.fit || 0);
  const pk = state.packs[j.k];
  const lvl = j.lvl === "unspecified" ? "Level not stated" : (j.lvl || "").replace(/^./, c => c.toUpperCase());
  const opts = STATUSES.map(s => `<option value="${s}" ${s===j.status?"selected":""}>${STATUS_TEXT[s]}</option>`).join("");
  const L = pk ? splitLetter(pk.letter) : {letter:"", why:""};
  if (pk && pk.why) L.why = pk.why;
  const cvOpen = state.open.has("cv:" + j.k), clOpen = state.open.has("cl:" + j.k);
  const jpOpen = state.open.has("jp:" + j.k);
  return `<article class="pack job" data-k="${esc(j.k)}">
    <div class="pack-head">
      <div class="score" title="Fit score out of 100"><span class="v" style="color:${fitColor(f)}">${f}</span><span class="meter"><i style="width:${Math.min(100,f)}%;background:${fitColor(f)}"></i></span></div>
      <div class="main">
        <h2 class="title"><a href="${esc(j.url)}" target="_blank" rel="noopener">${esc(j.t)}</a></h2>
        <div class="meta"><span class="co">${esc(j.co)}</span><span>${esc(j.ctry || j.loc || "")}</span>
          <span class="pill p-${esc(j.lab)}">${esc(LABEL_TEXT[j.lab] || j.lab)}</span><span>${esc(lvl)}</span>${j.st ? '<span class="pill p-stretch">Stretch</span>' : ""}</div>
        ${j.why ? `<p class="why">${esc(j.why)}</p>` : ""}
        ${j.gaps && j.gaps.length ? `<div class="gaps">Gaps ${j.gaps.map(g=>`<span class="gap">${esc(g)}</span>`).join("")}</div>` : ""}
      </div>
      <div class="side">
        <select class="status s-${j.status}" aria-label="Status for ${esc(j.t)}" ${state.writable?"":"disabled"}>${opts}</select>
        <a class="btn primary" href="${esc(j.url)}" target="_blank" rel="noopener">Apply on their site ↗</a>
      </div>
    </div>
    <section class="pack-sec"><h3><span class="step">1</span>Job posting<span class="tools">${pk ? `<button class="btn toggle" data-open="jp:${esc(j.k)}" aria-expanded="${jpOpen}">${jpOpen ? "Hide posting" : "Show posting"}</button>` : ""}<a class="btn" href="${esc(j.url)}" target="_blank" rel="noopener">Open original ↗</a></span></h3>
      ${pk ? (jpOpen ? `<pre class="posting">${esc(pk.desc)}</pre>` : "") : (packFailed.has(j.k) ? `<p class='ev'>Could not load this pack. <button class="btn retry-pack">Try again</button></p>` : "<p class='ev'>Loading…</p>")}</section>
    <section class="pack-sec"><h3><span class="step">2</span>Tailored CV<span class="tools">${pk && pk.cv_html ? `<button class="btn toggle" data-open="cv:${esc(j.k)}" aria-expanded="${cvOpen}">${cvOpen ? "Hide CV" : "Show CV"}</button>` : ""}${(j.cvp || j.cvn) ? `<a class="btn cv-pdf" href="${esc(j.cvp || "#")}" target="_blank" rel="noopener">Download PDF</a>` : ""}${j.cvn ? `<button class="btn cv-word">Download Word</button>` : ""}</span></h3>
      ${pk && pk.cv_html ? (cvOpen ? `<div class="cvdoc">${pk.cv_html}</div>` : "") : "<p class='ev'>No CV yet.</p>"}</section>
    <section class="pack-sec"><h3><span class="step">3</span>Cover letter<span class="tools">${L.letter ? `<button class="btn toggle" data-open="cl:${esc(j.k)}" aria-expanded="${clOpen}">${clOpen ? "Hide letter" : "Show letter"}</button><button class="btn copy-pack">Copy letter</button>` : ""}</span></h3>
      ${L.letter ? (clOpen ? `<pre class="letter-text">${esc(L.letter)}</pre>` : "") : "<p class='ev'>No letter yet.</p>"}
      ${L.why && clOpen ? `<p class="why-text"><b>Why this company</b> (for application forms): ${esc(L.why)}</p>` : ""}</section>
    ${(j.notes || state.open.has("n:"+j.k)) ? `<div class="note" style="grid-column:auto"><textarea aria-label="Notes" placeholder="Recruiter name, dates, next step" ${state.writable?"":"disabled"}>${esc(j.notes)}</textarea><div class="hint">Saved when you click away.</div></div>` : `<div><button class="btn note-btn">Add note</button></div>`}
  </article>`;
}

function render(){
  // Hold re-draws while a note is being typed, so the cursor stays put.
  const a = document.activeElement;
  if (a && a.tagName === "TEXTAREA" && a.closest("#list")) { state.pending = true; return; }
  state.pending = false;
  const all = jobs();
  renderHeader(all); renderPipe(all); renderTabs(all);
  const list = filtered(all);
  const shown = list.slice(0, state.limit);
  let html = shown.map(j => (state.tab === "ready" || j.lf) ? packCard(j) : card(j)).join("");
  if (!list.length) {
    html = `<div class="empty">${state.meta ? (state.tab==="mine" ? "No applications yet. Set a job to Applied and it shows up here." : state.tab==="ready" ? "No letters ready yet. Letters and tailored CVs appear here as they are written." : "No jobs match these filters.") : "No jobs yet. They appear here after the first run."}</div>`;
  } else if (list.length > shown.length) {
    html += `<button class="btn more" id="more">Show ${Math.min(60, list.length - shown.length)} more of ${list.length - shown.length}</button>`;
  }
  $("#list").innerHTML = html;
  for (const j of shown) if ((state.tab === "ready" || j.lf) && !state.packs[j.k]) queuePack(j.k);
  $("#legend").innerHTML = state.meta ? `<span>${list.length} jobs in this view</span><span>Fit: CV and project match, skills, role and level</span><span>Jobs with a letter also have a tailored CV to download</span><span>Status changes save for you and sync into the tracker on the next run</span>` : "";
}

async function saveEdit(j, patch){
  if (document.activeElement && document.activeElement.tagName === "TEXTAREA") document.activeElement.blur();
  if (!state.db) { toast("Open this page on claude.ai to save"); return; }
  const prev = state.edits[j.k] || {};
  const next = {...prev, status: j.status, notes: j.notes || "", date_applied: j.da || "", ...patch, updated_at: stamp(),
    snap: {co:j.co, t:j.t, url:j.url, fit:j.fit, lab:j.lab, ctry:j.ctry, lvl:j.lvl, lf:j.lf || "", why:j.why || ""}};
  if (next.status === "applied" && !next.date_applied) next.date_applied = today();
  state.edits[j.k] = next;
  render();
  try { await state.db.doc("edits/" + j.k).set(next); toast("Saved"); }
  catch(e){
    if (e && e.code === "invalid_argument") { state.writable = false; render(); toast("You can view this page but not change it"); }
    else toast("Could not save. Try again in a moment.");
  }
}

async function getDownloads(){
  if (state.downloads === undefined) state.downloads = (window.claude && await window.claude.use("downloads")) || null;
  return state.downloads;
}
function b64bytes(b64){ const bin = atob(b64); const out = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i); return out; }
async function saveWord(k){
  const j = jobs().find(x => x.k === k); if (!j || !state.db) { toast("Open this page on claude.ai to download"); return; }
  const dl = await getDownloads();
  if (!dl) { toast("Downloads are not available in this view"); return; }
  try {
    const snap = await state.db.doc("cvdocs/" + k).get();
    if (!snap.exists) { toast("The Word file appears after the next sync"); return; }
    await dl.save({filename: j.cvn + ".docx", data: b64bytes(snap.data().b64)});
    toast("Saved");
  } catch(e) { if (!e || e.code !== "declined") toast("Could not save the file. Try again."); }
}
async function savePdf(k, a){
  const j = jobs().find(x => x.k === k);
  const dl = await getDownloads();
  if (!dl || !j) { window.open(a.href, "_blank", "noopener"); return; }
  try {
    // The PDF is kept in the page database too; that works on phones.
    let data = null;
    if (state.db) {
      const snap = await state.db.doc("cvpdfs/" + k).get();
      if (snap.exists) data = b64bytes(snap.data().b64);
    }
    if (!data) {
      if (!j.cvp) throw new Error("no pdf");
      const r = await fetch(j.cvp);
      const blob = await r.blob();
      // Only accept a real PDF, never a short error page.
      const head = new Uint8Array(await blob.slice(0, 5).arrayBuffer());
      if (!r.ok || blob.size < 1000 || String.fromCharCode(...head) !== "%PDF-") throw new Error("bad pdf");
      data = blob;
    }
    await dl.save({filename: j.cvn + ".pdf", data});
    toast("Saved");
  } catch(e) {
    if (e && e.code === "declined") return;
    toast("Could not get the PDF. Try Download Word, or try again after the next sync.");
  }
}
document.addEventListener("click", e => {
  const a = e.target.closest("a.cv-pdf"); if (!a) return;
  e.preventDefault(); const art = a.closest(".job"); savePdf(art.dataset.k, a);
});

// Packs (posting, CV and letter) are read one job at a time as cards
// show, never all at once, so a large collection cannot break the page.
const packQueue = [], packAsked = new Set(), packFailed = new Set();
let packBusy = 0;
function queuePack(k){
  if (!state.db || packAsked.has(k)) return;
  packAsked.add(k); packQueue.push(k); pumpPacks();
}
function pumpPacks(){
  while (packBusy < 4 && packQueue.length) {
    const k = packQueue.shift(); packBusy++;
    state.db.doc("packs/" + k).get()
      .then(s => { if (s.exists) state.packs[k] = s.data(); else packFailed.add(k); })
      .catch(() => packFailed.add(k))
      .finally(() => { packBusy--; render(); pumpPacks(); });
  }
}
async function loadLetter(k){
  if (state.letters[k] || !state.db) return;
  try { const s = await state.db.doc("letters/" + k).get(); state.letters[k] = s.exists ? s.data() : {text:"No letter saved yet. It appears after the next sync.", file:""}; }
  catch(e){ state.letters[k] = {text:"Could not load the letter.", file:""}; }
  render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button");
  if (!t) return;
  if (t.dataset.tab) { state.tab = t.dataset.tab; state.status = ""; state.limit = 60; try{localStorage.setItem("tab", state.tab)}catch(_){} render(); return; }
  if (t.dataset.status) { state.status = state.status === t.dataset.status ? "" : t.dataset.status; if (state.status) state.tab = "all"; state.limit = 60; render(); return; }
  if (t.id === "more") { state.limit += 60; render(); return; }
  const art = t.closest(".job"); if (!art) return;
  const k = art.dataset.k;
  if (t.classList.contains("letter-btn")) { state.open.has(k) ? state.open.delete(k) : (state.open.add(k), loadLetter(k)); render(); }
  if (t.classList.contains("note-btn")) { state.open.add("n:"+k); render(); const ta = document.querySelector(`.job[data-k="${CSS.escape(k)}"] textarea`); ta && ta.focus(); }
  if (t.classList.contains("toggle")) { const id = t.dataset.open; state.open.has(id) ? state.open.delete(id) : state.open.add(id); render(); return; }
  if (t.classList.contains("cv-word")) { saveWord(k); return; }
  if (t.classList.contains("retry-pack")) { packFailed.delete(k); packAsked.delete(k); render(); return; }
  if (t.classList.contains("copy-pack")) {
    const text = splitLetter((state.packs[k]||{}).letter).letter;
    navigator.clipboard.writeText(text).then(() => toast("Letter copied")).catch(() => {
      if (!art.querySelector(".letter-text")) { state.open.add("cl:" + k); render(); }
      const pre = document.querySelector(`.job[data-k="${CSS.escape(k)}"] .letter-text`); if (!pre) return; const r = document.createRange(); r.selectNodeContents(pre); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); toast("Selected. Press copy.");
    });
    return;
  }
  if (t.classList.contains("copy")) {
    const text = splitLetter((state.letters[k]||{}).text).letter;
    navigator.clipboard.writeText(text).then(() => toast("Letter copied")).catch(() => {
      const pre = art.querySelector("pre"); const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("Selected. Press copy.");
    });
  }
});

document.addEventListener("change", e => {
  const el = e.target;
  if (el.id === "label") { state.label = el.value; state.limit = 60; render(); return; }
  if (el.id === "level") { state.level = el.value; state.limit = 60; render(); return; }
  const art = el.closest(".job"); if (!art) return;
  const j = jobs().find(x => x.k === art.dataset.k); if (!j) return;
  if (el.classList.contains("status")) saveEdit(j, {status: el.value});
});
document.addEventListener("focusout", e => {
  const el = e.target;
  if (el.tagName !== "TEXTAREA") return;
  const art = el.closest(".job"); const j = art && jobs().find(x => x.k === art.dataset.k);
  if (j && el.value !== (j.notes || "")) saveEdit(j, {notes: el.value});
  else if (state.pending) setTimeout(render, 0);
});
$("#q").addEventListener("input", e => { state.q = e.target.value; state.limit = 60; render(); });
$("#minfit").addEventListener("input", e => { state.minfit = +e.target.value; $("#minfitv").textContent = e.target.value; render(); });

render();

(async () => {
  const db = window.claude && await window.claude.use("db");
  if (!db) { render(); return; }
  state.db = db;
  const onErr = e => { if (e && e.code === "revoked") { state.db = null; render(); } };
  db.doc("meta/run").onSnapshot(s => { state.meta = s.exists ? s.data() : null; render(); }, onErr);
  db.collection("chunks").onSnapshot(s => { state.chunks = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); render(); }, onErr);
  db.collection("edits").onSnapshot(s => { state.edits = Object.fromEntries(s.docs.map(d => [d.id, d.data()])); render(); }, onErr);
})();
</script>
