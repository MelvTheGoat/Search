# How the fit score (0 to 100) is built. Change the numbers to tune it.
# Step 1: a weighted average of these parts, each between 0 and 1.
weights:
  cv_similarity: 0.30       # job text vs your whole CV (embeddings)
  project_similarity: 0.20  # job text vs your best matching project
  skills: 0.20              # share of the job's skills that are in your CV
  role: 0.22                # target title high, related title lower
  domain: 0.08              # fraud, risk, credit, payments, fintech
# Step 2: that average is multiplied by the level score below, so senior
# roles stay in the list but sink to the bottom.

# When a post names only a few skills, the skills score is pulled toward
# 0.5 so one lucky match does not give 100%.
skills_prior_weight: 2

embedding:
  model: all-MiniLM-L6-v2
  # Raw cosine similarity is mapped to 0..1 between these two values.
  floor: 0.30
  ceiling: 0.70
  chunk_words: 180
  max_chunks: 4

level_scores:       # multiplier on the score
  intern: 1.0
  graduate: 1.0
  junior: 1.0
  entry: 1.0
  unspecified: 0.9
  mid: 0.8          # flagged as "stretch"
  senior: 0.45
  lead: 0.4
  staff: 0.35
  principal: 0.35
  manager: 0.35

role_scores:
  target: 1.0
  related: 0.5
  other: 0.25

# Title patterns (regular expressions, any case).
target_titles:
  - "machine learning"
  - "\\bml\\b"
  - "\\b(ai|artificial intelligence|gen ?ai|generative ai|llm)\\b.*(engineer|scien|research|developer)"
  - "(engineer|scien|research|developer).*\\b(ai|artificial intelligence|gen ?ai|llm)\\b"
  - "applied scien"
  - "data scien"
  - "mlops|ml ops|ml platform|ml infra"
  - "research engineer"
  - "research scientist"
  - "deep learning"
  - "\\bnlp\\b|natural language"
  - "computer vision"
  - "(fraud|risk|credit|aml|fincrime).*(scien|\\bml\\b|machine learning|model|data|engineer|analytic)"
  - "(scien|\\bml\\b|machine learning|model|data|engineer|analytic).*(fraud|risk|credit|aml|fincrime)"
  - "decision scien"
  - "quantitative (research|analyst|developer)"
related_titles:
  - "fraud|risk|credit|underwrit|fincrime|\\baml\\b"
  - "\\bai\\b|\\bllm|artificial intelligence"
  - "data analy"
  - "analytics engineer"
  - "data engineer"
  - "business intelligence|\\bbi\\b"
  - "analytics"
  - "statistic"
  - "insights"
  - "data platform"
  - "risk analyst"
  - "quant"

domain_keywords:
  - fraud
  - "credit risk"
  - "risk model"
  - underwriting
  - payments
  - fintech
  - "anti-money laundering|\\baml\\b"
  - "\\bkyc\\b"
  - reconciliation
  - lending
  - chargeback

# Step 2 of the pipeline: drop jobs clearly unrelated to data, ML or AI.
filter:
  # Keep the job if the title matches any of these...
  keep_titles:
    - "machine learning|\\bml\\b|\\bai\\b|artificial intelligence|\\bllm|gen ?ai|generative"
    - "data scien|data analy|data engineer|analytics|\\bdata\\b"
    - "applied scien|research (engineer|scientist)|scientist"
    - "mlops|deep learning|\\bnlp\\b|computer vision|perception|recommend|search relevance|ranking"
    - "fraud|risk|credit|quant|statistic|decision scien|insights|business intelligence"
  # ...or if the title looks like engineering or research AND the text
  # mentions ML words at least this many times.
  engineer_titles: "engineer|developer|scientist|researcher|research"
  ml_words: "machine learning|\\bml\\b|deep learning|\\bllms?\\b|pytorch|tensorflow|model training|neural|embedding|\\brag\\b|inference"
  min_ml_words: 4
  # Always drop titles with these words, even if they match the above.
  drop_titles:
    - "sales|account executive|account manager|recruit|talent|counsel|legal|attorney|paralegal"
    - "marketing|copywriter|content writer|customer success|support specialist|office manager"
    - "sourcer|payroll|accountant|bookkeep|facilities|executive assistant|\\bhr\\b|people partner"
    - "data entry|annotator|annotation|labell?er|tutor|writing evaluator|rater\\b|transcri"
