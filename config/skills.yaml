# Skills the tool looks for in job posts and in your CV.
# name: list of regular expressions (any case unless case_sensitive is set).
# A skill in a job post but not in your CV is listed as a gap.
# Add more lines here any time.
Python: ["\\bpython\\b"]
SQL: ["\\bsql\\b"]
R: {patterns: ["(?<![\\w&])R(?=[,/)]| (?:or|and)\\b| programming)", "\\bRStudio\\b"], case_sensitive: true}
