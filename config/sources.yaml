# Which sources to use and how hard to hit them.
# min_interval is the least number of seconds between two calls to one host.
# refetch_hours: aggregator results are cached and not fetched again sooner
# than this, to respect their rate limits.

http:
  min_interval: 1.0
  retries: 4
  backoff: 2.0
  timeout: 30
  # Seconds between calls to one site. A site covers all its subdomains,
  # so all Personio or Recruitee boards share one pace.
  per_host:
    remoteok.com: 3.0
    remotive.com: 3.0
    himalayas.app: 1.5
    arbeitnow.com: 1.5
    adzuna.com: 1.5
    jobicy.com: 3.0
    workingnomads.com: 3.0
    weworkremotely.com: 3.0
    algolia.com: 1.0
    themuse.com: 1.5
    reed.co.uk: 1.5
    jooble.org: 1.5
    findwork.dev: 1.5
    smartrecruiters.com: 0.5
    workable.com: 4.0
    personio.de: 12.0
    recruitee.com: 2.0
    bamboohr.com: 1.0
    breezy.hr: 1.0
    amazon.jobs: 1.5

# Company boards (the list is in companies.yaml)
greenhouse: {enabled: true}
lever: {enabled: true}
ashby: {enabled: true}
smartrecruiters: {enabled: true}
workable: {enabled: true}
recruitee: {enabled: true}
personio: {enabled: true}

# Public job boards and feeds, no key needed

remoteok:
  enabled: true
  refetch_hours: 6

remotive:
  enabled: true
  refetch_hours: 8          # Remotive asks for at most 4 calls a day
  categories: [data, software-dev, ai-ml]

arbeitnow:
  enabled: true
  refetch_hours: 6
  max_pages: 8

himalayas:
  enabled: true
  refetch_hours: 6
  queries: ["machine learning", "data scientist", "AI engineer", "LLM", "MLOps", "data analyst", "fraud", "research engineer"]
  max_pages: 10             # 20 jobs a page, per query
  countries: [Nigeria]      # also search remote jobs open to people in these countries

jobicy:
  enabled: true
  refetch_hours: 6
  industries: [data-science, engineering]

workingnomads:
  enabled: true
  refetch_hours: 6

weworkremotely:
  enabled: true
  refetch_hours: 6
  feeds: [remote-jobs]      # the feed of all jobs; the keyword filter does the rest

hn_whoishiring:
  # The monthly "Ask HN: Who is hiring?" thread
  enabled: true
  refetch_hours: 24

themuse:
  enabled: true
  refetch_hours: 12
  categories: ["Data and Analytics", "Data Science", "Science and Engineering", "Software Engineering"]
  levels: [Internship, Entry Level, Mid Level]
  max_pages: 10

# Sources that need a free key in .env. They are skipped without one.
adzuna:
  # Only used when ADZUNA_APP_ID and ADZUNA_APP_KEY are set in .env
  enabled: true
  refetch_hours: 20
  countries: [gb, us, at, au, be, br, ca, ch, de, es, fr, in, it, mx, nl, nz, pl, sg, za]
  queries: ["machine learning", "data scientist", "AI engineer"]
  results_per_page: 50
  max_days_old: 30

reed:
  # UK jobs. Free key: https://www.reed.co.uk/developers  (REED_API_KEY)
  enabled: true
  refetch_hours: 20
  queries: ["machine learning", "data scientist", "AI engineer", "graduate data scientist"]

jooble:
  # Jobs from many countries. Free key: https://jooble.org/api/about  (JOOBLE_API_KEY)
  enabled: true
  refetch_hours: 20
  queries: ["machine learning engineer", "data scientist", "AI engineer"]
  locations: ["", "Nigeria", "United Kingdom", "Germany", "Netherlands", "Canada", "United Arab Emirates"]

findwork:
  # Tech jobs. Free key: https://findwork.dev/developers/  (FINDWORK_API_KEY)
  enabled: true
  refetch_hours: 20
  queries: ["machine learning", "data scientist"]

# Amazon's own job search, for African countries (Amazon and AWS hire in
# Cape Town, Nairobi, Lagos and Cairo). Country codes are three letters.
amazon:
  enabled: true
  refetch_hours: 12
  countries: [ZAF, KEN, NGA, EGY, MAR, GHA, RWA]
  queries: ["machine learning", "data scientist", "data engineer", "applied scientist", "business intelligence", "fraud", "risk", "AI"]
  max_results: 200
