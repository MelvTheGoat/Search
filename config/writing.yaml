# Rules `python hunt.py check` uses on every letter file.

# Characters that count as dashes. Hyphens inside words (like "end-to-end")
# are fine. A hyphen with spaces on both sides is flagged, as it is used as a dash.
dash_chars: ["—", "–", "‒", "―", "−", "⸺", "⸻", "﹘", "﹣", "－"]

# Phrases that must never appear (any case). Add more any time.
