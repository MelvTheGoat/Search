# Companies whose job boards the tool reads.
#
# One company per line. To add one, copy a line and change it:
#   name:   company name as you want it shown
#   ats:    greenhouse, lever or ashby
#   token:  the board name in the job board URL, for example
#           boards.greenhouse.io/TOKEN, jobs.lever.co/TOKEN, jobs.ashbyhq.com/TOKEN
#   country: where the head office is (for your reference)
#   sector: ai-lab, ml-infra, fintech, africa, tech, quant, health, mobility, other
#   known_sponsor: true (optional) if the company is known to sponsor visas
#   aliases: [Legal Name Ltd] (optional) extra names to match the sponsor registers
#   region: eu (optional, Lever only) for boards on jobs.eu.lever.co
#
# After adding, run `python hunt.py verify-companies` to test the tokens.
# It tries the other two ATSs if a token is dead, and moves dead ones to
# companies_removed.yaml.

